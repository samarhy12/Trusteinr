{% extends "base.html" %}
{% block title %}Record expense — Trustline Finance{% endblock %}
{% block page_title %}Record an expense{% endblock %}
{% block page_sub %}<div class="text-xs text-ink-400 mt-0.5">This will be deducted from cash in hand immediately</div>{% endblock %}

{% block content %}
<div class="card card-pad w-full max-w-md">
  <form method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field mb-4">
      <label for="description">Description</label>
      <input type="text" id="description" name="description" placeholder="e.g. Fuel for field visits" required
             value="{{ form.get('description','') }}">
    </div>
    <div class="field mb-4">
      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="" disabled {{ 'selected' if not form.get('category') }}>Select category</option>
        {% for c in categories %}
        <option value="{{ c }}" {{ 'selected' if form.get('category') == c }}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field mb-4">
      <label for="amount">Amount (GHS)</label>
      <input type="number" id="amount" name="amount" min="0.01" step="0.01" required
             value="{{ form.get('amount','') }}">
    </div>
    <div class="field mb-5">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required value="{{ form.get('date') or today }}">
    </div>
    <div class="flex flex-col sm:flex-row gap-3">
      <button type="submit" class="btn btn-gold">Record expense</button>
      <a href="{{ url_for('expenses.list_expenses') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
