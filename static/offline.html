<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline — Trustline Finance</title>
  <link rel="icon" href="/static/icons/icon-32.png" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAF8;
      color: #17181B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
    }
    img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 20px; }
    h1 { font-size: 19px; margin: 0 0 8px; color: #121316; }
    p { font-size: 14px; color: #83868D; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #D6A119;
      color: #121316;
      border: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/icons/icon-192.png" alt="Trustline Finance" />
    <h1>You're offline</h1>
    <p>This page needs a network connection to reach the Trustline Finance server. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
